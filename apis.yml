name: Modern Fertility
description: >-
  Modern Fertility is a women's health company offering at-home fertility and
  hormone testing along with pregnancy, ovulation and prenatal products. Its
  flagship Modern Fertility Hormone Test lets people measure reproductive
  hormones from home and review results with providers. The company was
  acquired by telehealth provider Ro and is now operated as part of Ro:
  modernfertility.com redirects to ro.co/fertility and the brand's products,
  accounts, legal terms and security program are served under the parent Ro
  platform. Modern Fertility exposes no public developer or API surface; this
  profile tracks it as a consumer health brand within the API Evangelist
  network.
